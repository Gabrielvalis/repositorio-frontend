<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Formulário</title>
</head>
<body>
    <header>
        <h1>Página de cadastro - Exemplo</h1>
    </header>
    <main>
        <section>
            <form id="registerForm" method="POST"> 
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome"
                required />
                <br><br>
                <label for="email">Informe seu e-mail:</label>
                <input type=""email id="nome" name="email"
                required/>
                <br><br>
                <label form="senha">Informe sua senha:</label>
                <input id="senha" name="senha" type="password"
                required minlength="8" maxlength="12"/>
                <br><br>
                <input type="text" id="cpf" name="cpf" 
                placeholder="CPF" pattern="\d{3}\.\d{3}\.\d{3}-d{2}"
                title="Formato esperado: 000.000.000.-00"/>
                <br><br>

                <textarea id="mensagem" name="mensagem" rows="4"
                cols="30" placeholder="Digite o texto"></textarea>
                <br><br>
                <label for="evento">Escolha seu evento:</label>
                <select id="evento" name="evento">
                    <option value="Rock">Show Rock</option>
                    <option value="Sertanejo">Show Sertanejo</option>
                    <option value="Jogos">Jogos universitários
                    </option>
                    <br>
                </select>
                <br>
                <label for="termos">
                    <input id="termos" name="termos" type="checkbox" 
                    required/> Concordo com os termos de uso
                </label>
                <br>
                <label>
                    <input type="radio" 
                    value="pix" name="pagamento"/>Pix
                </label>
                <label>
                    <input type="radio"
                    value="cartao" name="pagamento"/>Cartao
                </label>
                <label>
                    <input type="radio"
                    value="boleto"name="pagamento"/>Boleto
                </label>
                <br>
                <input type="number" step="5" />
                <br>
                
                <br>
                <input type="submit" value="Cadastrar" />
                
            
            </form>
        </section>
    </main>
    <footer>
        <p> &copy; Desenvolvido por Gabriel </p>
    </footer>

    <script>
        // pegando através do ID do formulario o evento de submissão (envio) do Forms
        document.getElementById('registerForm').
        addEventListener('submit', function(event){event.preventDefault();
        // Este comando evita o recarregamento da página
        const nome = document.getElementById('nome').value
        const cpf = document.getElementById('cpf').value
        const password = document.getElementById('senha').value
        
        alert('Formulário preenchido')
        alert('Aqui estão os seus dados: '+ cpf+" "+password)
    })
    </script>

</body>
</html>
